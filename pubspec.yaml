name: finve
description: Personal finance app for Venezuelan users with multi-currency support.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Local storage
  sqflite: ^2.3.3+1
  path_provider: ^2.1.3
  path: ^1.9.0

  # Secure storage (PIN, sensitive data)
  flutter_secure_storage: ^9.2.2

  # Biometric / PIN authentication
  local_auth: ^2.3.0

  # Local notifications
  flutter_local_notifications: ^18.0.1

  # Home screen widgets
  home_widget: ^0.6.0

  # HTTP / networking
  http: ^1.2.1
  intl: ^0.19.0

  # Charts
  fl_chart: ^0.68.0

  # Icons / UI extras
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
